name: Deploy static content to Pages

env:
  PUBLISH_DIR: ElliotPurdum.com/bin/Release/net10.0/publish/wwwroot
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get latest .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Cache the NuGet package directory between runs. Saves ~30–60s of network restore on warm runs.
      # Key is bound to every .csproj/.config so any dependency change invalidates the cache.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/NuGet.Config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Single restore covers Source, Compiler, public site, and admin. Subsequent dotnet
      # build/publish commands run with --no-restore so they don't re-resolve packages.
      - name: Restore
        run: dotnet restore ElliotPurdum.com.slnx

      - name: Build Source Project
        run: dotnet build ElliotPurdum.com.Source/ElliotPurdum.com.Source.csproj -c Release --no-restore

      - name: Generate Static Pages
        working-directory: BlogGenerator/TimPurdum.Dev.BlogGenerator.Compiler
        run: dotnet run -c Release --no-restore

      - name: Publish public site
        run: dotnet publish ElliotPurdum.com/ElliotPurdum.com.csproj -c Release --no-restore

      # The admin portal is a separate Blazor WASM app. Its output only changes when admin sources
      # or publish inputs do — every content edit (post / music / show / gallery / page) leaves
      # admin untouched. Cache the publish output keyed on the admin source tree plus dependency
      # and tooling inputs so changes to NuGet feeds or SDK selection also invalidate the cache.
      # Saves ~the full WASM publish step (~30–60s on a cold runner) on every content-only commit.
      - name: Cache admin publish output
        id: admin-cache
        uses: actions/cache@v4
        with:
          path: admin-publish/wwwroot
          key: admin-publish-${{ runner.os }}-dotnet-10.x-${{ hashFiles('ElliotPurdum.com.Admin/**', '!ElliotPurdum.com.Admin/bin/**', '!ElliotPurdum.com.Admin/obj/**', '**/NuGet.Config', 'global.json') }}

      - name: Publish admin portal
        if: steps.admin-cache.outputs.cache-hit != 'true'
        run: dotnet publish ElliotPurdum.com.Admin/ElliotPurdum.com.Admin.csproj -c Release --no-restore -o admin-publish

      - name: Stage admin under /admin
        run: |
          mkdir -p ${{ env.PUBLISH_DIR }}/admin
          cp -r admin-publish/wwwroot/. ${{ env.PUBLISH_DIR }}/admin/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PUBLISH_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
