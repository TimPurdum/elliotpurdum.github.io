<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <!-- Force index.html itself to revalidate; Blazor framework files use hash-based cache busting. -->
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Admin — Elliot Purdum</title>
    <base href="/admin/" />
    <script>
        // SPA-fallback restore. The site-level /404.html stashes the originally requested
        // /admin/* path in sessionStorage and bounces the browser here. Restore the URL via
        // history.replaceState BEFORE Blazor boots so its router lands on the right page.
        (function () {
            try {
                var saved = sessionStorage.getItem("admin.spa.redirect");
                if (saved) {
                    sessionStorage.removeItem("admin.spa.redirect");
                    if (saved.indexOf("/admin/") === 0 || saved === "/admin") {
                        history.replaceState(null, "", saved);
                    }
                }
            } catch (e) { /* ignore */ }
        })();
    </script>
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Source+Sans+3:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <div class="splash">
            <p>Loading admin…</p>
        </div>
    </div>
    <noscript>This admin tool needs JavaScript enabled.</noscript>
    <!-- Markdown preview rendering. Self-hosted (marked v15 — last release with marked.min.js UMD bundle). -->
    <script src="js/marked.min.js"></script>
    <script>
        // Tiny wrapper so the editor can call this via IJSRuntime without depending on marked's ABI.
        window.adminRenderMarkdown = function (text) {
            try {
                return (typeof marked === "undefined") ? "" : marked.parse(text || "");
            } catch (e) {
                return "<p><em>Preview error: " + (e && e.message ? e.message : "unknown") + "</em></p>";
            }
        };

        // Client-side image resize. Returns Uint8Array (JPEG-encoded) so the C# side can hand it
        // straight to the GitHub Contents API. Resizing in the browser keeps the GitHub bandwidth
        // small and the repo lean — full-res Pixel photos compress 10x at maxWidth=2000.
        window.adminResizeImage = function (bytes, maxWidth, quality) {
            return new Promise(function (resolve, reject) {
                try {
                    var blob = new Blob([bytes]);
                    var url = URL.createObjectURL(blob);
                    var img = new Image();
                    img.onload = function () {
                        URL.revokeObjectURL(url);
                        var ratio = Math.min(1, maxWidth / img.naturalWidth);
                        var w = Math.round(img.naturalWidth * ratio);
                        var h = Math.round(img.naturalHeight * ratio);
                        var canvas = document.createElement("canvas");
                        canvas.width = w;
                        canvas.height = h;
                        var ctx = canvas.getContext("2d");
                        // White background so PNG transparency doesn't go black when we re-encode to JPEG.
                        ctx.fillStyle = "#FFFFFF";
                        ctx.fillRect(0, 0, w, h);
                        ctx.drawImage(img, 0, 0, w, h);
                        canvas.toBlob(function (out) {
                            if (!out) { reject("canvas.toBlob produced no output"); return; }
                            out.arrayBuffer().then(function (buf) {
                                resolve(new Uint8Array(buf));
                            }, reject);
                        }, "image/jpeg", quality);
                    };
                    img.onerror = function () {
                        URL.revokeObjectURL(url);
                        reject("could not decode the uploaded file as an image");
                    };
                    img.src = url;
                } catch (e) {
                    reject(e && e.message ? e.message : String(e));
                }
            });
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
