<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <!-- Force index.html itself to revalidate; Blazor framework files use hash-based cache busting. -->
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Admin — Elliot Purdum</title>
    <base href="/admin/" />
    <script>
        // SPA-fallback restore. The site-level /404.html stashes the originally requested
        // /admin/* path in sessionStorage and bounces the browser here. Restore the URL via
        // history.replaceState BEFORE Blazor boots so its router lands on the right page.
        (function () {
            try {
                var saved = sessionStorage.getItem("admin.spa.redirect");
                if (saved) {
                    sessionStorage.removeItem("admin.spa.redirect");
                    if (saved.indexOf("/admin/") === 0 || saved === "/admin") {
                        history.replaceState(null, "", saved);
                    }
                }
            } catch (e) { /* ignore */ }
        })();
    </script>
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Source+Sans+3:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <div class="splash">
            <p>Loading admin…</p>
        </div>
    </div>
    <noscript>This admin tool needs JavaScript enabled.</noscript>
    <!-- Markdown preview rendering. Self-hosted (marked v15 — last release with marked.min.js UMD bundle). -->
    <script src="js/marked.min.js"></script>
    <script>
        // Tiny wrapper so the editor can call this via IJSRuntime without depending on marked's ABI.
        window.adminRenderMarkdown = function (text) {
            try {
                return (typeof marked === "undefined") ? "" : marked.parse(text || "");
            } catch (e) {
                return "<p><em>Preview error: " + (e && e.message ? e.message : "unknown") + "</em></p>";
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
